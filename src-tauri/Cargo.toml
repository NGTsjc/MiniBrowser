[package]
name = "minibrowser"
version = "0.2.0"
description = "Portable private web window"
edition = "2021"
rust-version = "1.96"

[[bin]]
name = "MiniBrowser"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "devtools"] }
tauri-plugin-single-instance = "=2.4.0"
tauri-plugin-global-shortcut = "=2.3.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
url = "=2.5.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
webview2-com = "=0.39.1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
